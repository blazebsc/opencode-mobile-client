name: Build Legacy Android APK

on:
  push:
    branches: [main]
    paths:
      - 'legacy/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Legacy Release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: legacy/pnpm-lock.yaml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-34"
          yes | sdkmanager "build-tools;34.0.0"
          yes | sdkmanager "platform-tools"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm run build

      - name: Add Android platform
        run: pnpm exec cap add android || pnpm exec cap sync android

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Download Termux bootstrap (aarch64)
        run: |
          mkdir -p android/app/src/main/assets
          curl -L -o android/app/src/main/assets/bootstrap-aarch64.zip \
            https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip
          echo "Bootstrap SHA256:"
          sha256sum android/app/src/main/assets/bootstrap-aarch64.zip

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: legacy/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-client-legacy-apk
          path: legacy/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# ---------------------------------------------------------------
# After the workflow finishes:
#   1. Go to Actions -> this run -> Artifacts section
#   2. Download "opencode-mobile-client-apk"
#   3. Unzip it if needed to get app-debug.apk
#   4. Install: adb install -r app-debug.apk
#      (or transfer to phone and tap it in the file manager)
# ---------------------------------------------------------------