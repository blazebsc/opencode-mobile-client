name: Android APK Build and Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36"
          yes | sdkmanager "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download Termux bootstrap (aarch64)
        run: |
          mkdir -p android/app/src/main/assets
          curl -L -o android/app/src/main/assets/bootstrap-aarch64.zip \
            https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip
          echo "Bootstrap SHA256:"
          sha256sum android/app/src/main/assets/bootstrap-aarch64.zip

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-client-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Build and Publish Release APK
    if: github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_FILE: app/upload-keystore.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager "platforms;android-36"
          yes | sdkmanager "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Download Termux bootstrap (aarch64)
        run: |
          mkdir -p android/app/src/main/assets
          curl -L -o android/app/src/main/assets/bootstrap-aarch64.zip \
            https://github.com/termux/termux-packages/releases/latest/download/bootstrap-aarch64.zip
          echo "Bootstrap SHA256:"
          sha256sum android/app/src/main/assets/bootstrap-aarch64.zip

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required for release builds."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build release APK
        run: npm run android:play:apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-mobile-client-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true